name: Publish image

# Builds the single OpenBao + UI image and publishes it to GitHub Packages
# (ghcr.io). The image embeds a specific OpenBao version and is tagged to match
# it (tag parity): e.g. OpenBao 2.5.5 -> ghcr.io/<repo>:2.5.5, :2.5, :2, :latest
# — the same tags OpenBao itself publishes — plus an immutable :sha-<commit>.
#
# The OpenBao version comes from the repo's `.openbao-version` pin, or from the
# `openbao_version` input when this workflow is called/dispatched for a specific
# release (see sync-openbao.yml, which auto-publishes a matching image whenever
# a new OpenBao version is released).
#
# The app is built on the runner and packaged via docker/Dockerfile.runtime —
# The candidate image is tested locally, then that same image is tagged/pushed.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      openbao_version:
        description: "OpenBao version to embed + tag (defaults to .openbao-version)"
        type: string
        required: false
        default: ""
      make_latest:
        description: "Also move the :latest tag to this build"
        type: boolean
        required: false
        default: true
  # Callable from sync-openbao.yml to publish a matching image for a new release.
  workflow_call:
    inputs:
      openbao_version:
        type: string
        required: false
        default: ""
      make_latest:
        type: boolean
        required: false
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # -> ghcr.io/hasdfa/openbao-ui

jobs:
  publish:
    name: Validate, test image & push (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Resolve the OpenBao version (input wins, else the committed pin) and
      # derive the parity tag set. The version tag is the contract; latest moves
      # on default-branch pushes or when explicitly requested.
      - name: Resolve OpenBao version & image tags
        id: meta
        env:
          TARGET_OPENBAO_VERSION: ${{ inputs.openbao_version }}
        run: |
          set -euo pipefail
          version="$TARGET_OPENBAO_VERSION"
          if [ -z "$version" ]; then version="$(tr -d '[:space:]' < .openbao-version)"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid OpenBao version '$version' (expected MAJOR.MINOR.PATCH)"; exit 1
          fi
          major="${version%%.*}"; minor="${version#*.}"; minor="${minor%%.*}"
          img="${REGISTRY}/${IMAGE_NAME}"
          # tag parity with OpenBao: full, major.minor, major
          tags="${img}:${version},${img}:${major}.${minor},${img}:${major}"
          # immutable provenance tag
          tags="${tags},${img}:sha-$(echo "${GITHUB_SHA}" | cut -c1-12)"
          # latest: on a push to the default branch, or when a caller asks for it
          latest="false"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            latest="true"
          fi
          if [ "${{ inputs.make_latest }}" = "true" ] && [ "${{ github.event_name }}" != "push" ]; then
            latest="true"
          fi
          if [ "$latest" = "true" ]; then tags="${tags},${img}:latest"; fi
          {
            echo "version=${version}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing OpenBao ${version} as:"; printf '  %s\n' ${tags//,/ }

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build app
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Assemble runtime build context
        run: |
          mkdir -p ci-ctx/app
          cp -r .next/standalone/. ci-ctx/app/
          mkdir -p ci-ctx/app/.next && cp -r .next/static ci-ctx/app/.next/static
          cp -r public ci-ctx/app/public
          cp docker/entrypoint.sh docker/openbao.hcl ci-ctx/

      - uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        id: candidate
        uses: docker/build-push-action@v6
        with:
          context: ci-ctx
          file: docker/Dockerfile.runtime
          load: true
          push: false
          tags: openbao-ui:candidate
          build-args: |
            OPENBAO_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.openbao.version=${{ steps.meta.outputs.version }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start candidate image
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.imageid }}
        run: |
          docker run -d --name openbao-ui --init -p 3000:3000 \
            -e BAO_DEV=1 -e BAO_DEV_ROOT_TOKEN_ID=root "$CANDIDATE_IMAGE"
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ui2/login)" = "200" ]; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::candidate did not become ready"
          exit 1

      - run: pnpm exec playwright install --with-deps chromium
      - name: Test candidate against embedded OpenBao
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_TOKEN: root
        run: pnpm e2e

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the tested image
        env:
          CANDIDATE_IMAGE: ${{ steps.candidate.outputs.imageid }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            docker tag "$CANDIDATE_IMAGE" "$tag"
            docker push "$tag"
          done

      - name: Container logs on failure
        if: failure()
        run: docker logs openbao-ui || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: publish-playwright-results
          path: test-results/
          retention-days: 7

      - name: Stop candidate
        if: always()
        run: docker rm -f openbao-ui || true
