name: Publish image

# Builds the single OpenBao + UI image and publishes it to GitHub Packages
# (ghcr.io). The image embeds a specific OpenBao version and is tagged to match
# it (tag parity): e.g. OpenBao 2.5.5 -> ghcr.io/<repo>:2.5.5, :2.5, :2, :latest
# — the same tags OpenBao itself publishes — plus an immutable :sha-<commit>.
#
# The OpenBao version comes from the repo's `.openbao-version` pin, or from the
# `openbao_version` input when this workflow is called/dispatched for a specific
# release (see sync-openbao.yml, which auto-publishes a matching image whenever
# a new OpenBao version is released).
#
# The app is built on the runner and packaged via docker/Dockerfile.runtime —
# the exact artifact path CI's e2e job exercises — so we ship what we test.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      openbao_version:
        description: "OpenBao version to embed + tag (defaults to .openbao-version)"
        type: string
        required: false
        default: ""
      openbao_image:
        description: "Immutable OpenBao image reference (defaults to .openbao-image)"
        type: string
        required: false
        default: ""
      make_latest:
        description: "Also move the :latest tag to this build"
        type: boolean
        required: false
        default: true
  # Callable from sync-openbao.yml to publish a matching image for a new release.
  workflow_call:
    inputs:
      openbao_version:
        type: string
        required: false
        default: ""
      openbao_image:
        type: string
        required: false
        default: ""
      make_latest:
        type: boolean
        required: false
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # -> ghcr.io/hasdfa/openbao-ui

jobs:
  publish:
    name: Build & push (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # Resolve the OpenBao version (input wins, else the committed pin) and
      # derive the parity tag set. The version tag is the contract; latest moves
      # on default-branch pushes or when explicitly requested.
      - name: Resolve OpenBao version & image tags
        id: meta
        env:
          REQUESTED_OPENBAO_VERSION: ${{ inputs.openbao_version }}
          REQUESTED_OPENBAO_IMAGE: ${{ inputs.openbao_image }}
        run: |
          set -euo pipefail
          version="$REQUESTED_OPENBAO_VERSION"
          if [ -z "$version" ]; then version="$(tr -d '[:space:]' < .openbao-version)"; fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid OpenBao version '$version' (expected MAJOR.MINOR.PATCH)"; exit 1
          fi
          image="$REQUESTED_OPENBAO_IMAGE"
          if [ -z "$image" ]; then image="$(tr -d '[:space:]' < .openbao-image)"; fi
          if ! printf '%s' "$image" | grep -Eq '^quay\.io/openbao/openbao@sha256:[a-f0-9]{64}$'; then
            echo "::error::Invalid immutable OpenBao image reference"; exit 1
          fi
          major="${version%%.*}"; minor="${version#*.}"; minor="${minor%%.*}"
          img="${REGISTRY}/${IMAGE_NAME}"
          # tag parity with OpenBao: full, major.minor, major
          tags="${img}:${version},${img}:${major}.${minor},${img}:${major}"
          # immutable provenance tag
          tags="${tags},${img}:sha-$(echo "${GITHUB_SHA}" | cut -c1-12)"
          # latest: on a push to the default branch, or when a caller asks for it
          latest="false"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
            latest="true"
          fi
          if [ "${{ inputs.make_latest }}" = "true" ] && [ "${{ github.event_name }}" != "push" ]; then
            latest="true"
          fi
          if [ "$latest" = "true" ]; then tags="${tags},${img}:latest"; fi
          {
            echo "version=${version}"
            echo "image=${image}"
            echo "tags=${tags}"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing OpenBao ${version} as:"; printf '  %s\n' ${tags//,/ }

      - run: pnpm install --frozen-lockfile
      - name: Build app
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BUILD_REVISION: ${{ github.sha }}

      - name: Assemble runtime build context
        run: |
          mkdir -p ci-ctx/app
          cp -r .next/standalone/. ci-ctx/app/
          mkdir -p ci-ctx/app/.next && cp -r .next/static ci-ctx/app/.next/static
          cp -r public ci-ctx/app/public
          cp docker/entrypoint.sh docker/openbao.hcl ci-ctx/

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ci-ctx
          file: docker/Dockerfile.runtime
          push: true
          build-args: |
            OPENBAO_IMAGE=${{ steps.meta.outputs.image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.openbao.version=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
