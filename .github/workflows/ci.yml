name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BUILD_REVISION: ${{ github.sha }}

  e2e:
    name: E2E (Playwright vs real OpenBao)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BUILD_REVISION: ${{ github.sha }}

      # Assemble the standalone output + run it (with OpenBao) as the single
      # runtime image — same artifact behavior as the shipped image, but built
      # from the host-built app so CI never does an in-container install.
      - name: Build & start container
        run: |
          mkdir -p ci-ctx/app
          cp -r .next/standalone/. ci-ctx/app/
          mkdir -p ci-ctx/app/.next && cp -r .next/static ci-ctx/app/.next/static
          cp -r public ci-ctx/app/public
          cp docker/entrypoint.sh docker/openbao.hcl ci-ctx/
          docker build -f docker/Dockerfile.runtime \
            --build-arg OPENBAO_IMAGE="$(tr -d '[:space:]' < .openbao-image)" \
            -t openbao-ui:ci ci-ctx
          docker run -d --name openbao-ui --init -p 127.0.0.1:3000:3000 \
            -e NODE_ENV=development -e BAO_DEV=1 -e BAO_DEV_ROOT_TOKEN_ID=root \
            -e BAO_LOGIN_RATE_LIMIT=100 \
            openbao-ui:ci
          ok=""
          for i in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/ui2/login)" = "200" ]; then
              ok=1; echo "app ready after ${i}s"; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then echo "::error::app not ready"; docker logs openbao-ui; exit 1; fi

      - run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_TOKEN: root
        run: pnpm e2e

      - name: Container logs on failure
        if: failure()
        run: docker logs openbao-ui || true

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
